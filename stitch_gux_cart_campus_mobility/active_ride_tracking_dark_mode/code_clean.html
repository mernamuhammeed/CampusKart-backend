<script>
        // Simple cart movement animation simulation
        document.addEventListener('DOMContentLoaded', () => {
            const marker = document.getElementById('cart-marker');
            let position = 0;
            
            setInterval(() => {
                position += 0.5;
                if (position > 100) position = 0;
                
                // Minimalist movement logic along a curve
                const x = 320 + (position * 2.8);
                const y = 400 + (Math.sin(position * 0.1) * 50) + (position * 1.5);
                
                marker.style.transform = `translate(${position}px, ${position * 0.5}px)`;
            }, 50);
        });
    </script>
