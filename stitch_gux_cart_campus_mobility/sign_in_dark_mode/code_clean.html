<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary": "#68000a",
                    "on-primary-fixed-variant": "#005236",
                    "surface-variant": "#2d3449",
                    "outline-variant": "#3c4a42",
                    "secondary-fixed": "#ffddb8",
                    "secondary": "#ffb95f",
                    "inverse-on-surface": "#283044",
                    "on-error": "#690005",
                    "primary": "#4edea3",
                    "background": "#0b1326",
                    "on-tertiary-container": "#79000e",
                    "on-tertiary-fixed-variant": "#930013",
                    "surface-container-high": "#222a3d",
                    "surface-container-highest": "#2d3449",
                    "on-error-container": "#ffdad6",
                    "secondary-fixed-dim": "#ffb95f",
                    "on-surface": "#dae2fd",
                    "surface-bright": "#31394d",
                    "on-primary-container": "#00422b",
                    "tertiary-container": "#ff7a73",
                    "surface-tint": "#4edea3",
                    "on-secondary": "#472a00",
                    "on-secondary-fixed": "#2a1700",
                    "on-primary-fixed": "#002113",
                    "surface-container-low": "#131b2e",
                    "error": "#ffb4ab",
                    "primary-fixed-dim": "#4edea3",
                    "on-tertiary-fixed": "#410004",
                    "secondary-container": "#ee9800",
                    "tertiary-fixed": "#ffdad7",
                    "inverse-primary": "#006c49",
                    "surface-container-lowest": "#060e20",
                    "tertiary-fixed-dim": "#ffb3ad",
                    "on-surface-variant": "#bbcabf",
                    "tertiary": "#ffb3ad",
                    "outline": "#86948a",
                    "inverse-surface": "#dae2fd",
                    "surface-dim": "#0b1326",
                    "primary-container": "#10b981",
                    "surface": "#0b1326",
                    "primary-fixed": "#6ffbbe",
                    "surface-container": "#171f33",
                    "on-secondary-fixed-variant": "#653e00",
                    "on-primary": "#003824",
                    "error-container": "#93000a",
                    "on-secondary-container": "#5b3800",
                    "on-background": "#dae2fd"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-gap": "12px",
                    "container-padding": "20px",
                    "section-margin": "24px",
                    "touch-target": "48px",
                    "bottom-sheet-peak": "280px"
            },
            "fontFamily": {
                    "title-md": ["Outfit"],
                    "body-md": ["Outfit"],
                    "body-lg": ["Outfit"],
                    "headline-lg": ["Outfit"],
                    "headline-lg-mobile": ["Outfit"],
                    "label-sm": ["Outfit"],
                    "headline-xl": ["Outfit"],
                    "label-md": ["Outfit"]
            },
            "fontSize": {
                    "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "26px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0b1326;
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-focus-glow:focus-within {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
            border-color: #10b981;
        }
        .floating-bg {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(11, 19, 38, 0) 70%);
            z-index: -1;
            filter: blur(60px);
            border-radius: 50%;
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col items-center justify-center p-container-padding">
<!-- Atmospheric Background Effects -->
<div class="floating-bg -top-20 -left-20 animate-pulse"></div>
<div class="floating-bg -bottom-20 -right-20 animate-pulse" style="animation-delay: 2s;"></div>
<!-- Main Content Container -->
<main class="w-full max-w-md space-y-8 relative z-10">
<!-- Header Section -->
<header class="flex flex-col items-center space-y-4">
<div class="w-24 h-24 relative">
<img alt="GUX Cart Logo" class="w-full h-full object-contain" src="data:image/png;base64,STRIPPED"/>
<div class="absolute inset-0 bg-primary/20 blur-2xl rounded-full -z-10"></div>
</div>
<h1 class="font-headline-xl text-headline-xl tracking-tight text-white">
                GUX <span class="text-primary">Cart</span>
</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center px-8">
                The future of campus mobility. Fast, electric, and autonomous.
            </p>
</header>
<!-- Glassmorphism Form Card -->
<div class="glass-panel p-8 rounded-[24px] shadow-2xl space-y-6">
<form class="space-y-5" id="loginForm" onsubmit="event.preventDefault()">
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">University Email</label>
<div class="relative group input-focus-glow rounded-xl border border-white/10 bg-white/5 transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary">mail</span>
<input class="w-full bg-transparent border-none py-4 pl-12 pr-4 text-on-surface font-body-md focus:ring-0 placeholder:text-white/20" id="email" placeholder="student@university.edu" type="email"/>
</div>
</div>
<!-- Student ID Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="student-id">Student ID</label>
<div class="relative group input-focus-glow rounded-xl border border-white/10 bg-white/5 transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary">badge</span>
<input class="w-full bg-transparent border-none py-4 pl-12 pr-4 text-on-surface font-body-md focus:ring-0 placeholder:text-white/20" id="student-id" placeholder="8-digit ID number" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="password">Password</label>
<div class="relative group input-focus-glow rounded-xl border border-white/10 bg-white/5 transition-all duration-300">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary">lock</span>
<input class="w-full bg-transparent border-none py-4 pl-12 pr-4 text-on-surface font-body-md focus:ring-0 placeholder:text-white/20" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-white transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full py-4 bg-primary-container text-on-primary-container font-title-md text-title-md rounded-xl hover:opacity-90 active:scale-[0.98] transition-all shadow-[0px_4px_20px_rgba(16,185,129,0.3)] mt-2" type="submit">
                    Sign In
                </button>
</form>
<!-- Links -->
<div class="flex flex-col items-center space-y-3 pt-4 border-t border-white/5">
<a class="font-label-md text-label-md text-outline hover:text-primary transition-colors duration-200" href="#">
                    Forgot Password?
                </a>
<p class="font-label-md text-label-md text-on-surface-variant">
                    New to campus? 
                    <a class="text-primary font-bold ml-1 hover:underline underline-offset-4 decoration-2" href="#">Create Account</a>
</p>
</div>
</div>
<!-- Support Info -->
<footer class="flex justify-center space-x-6 text-outline font-label-sm text-label-sm pt-4">
<a class="hover:text-white transition-colors" href="#">Privacy Policy</a>
<span>•</span>
<a class="hover:text-white transition-colors" href="#">Terms of Service</a>
<span>•</span>
<a class="hover:text-white transition-colors" href="#">Help</a>
</footer>
</main>
<script>
        // Micro-interactions
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.02]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.02]');
            });
        });

        // Toggle Password Visibility simulation
        const visibilityBtn = document.querySelector('button .material-symbols-outlined:contains("visibility")');
        if (visibilityBtn) {
            visibilityBtn.parentElement.addEventListener('click', function() {
                const input = this.previousElementSibling;
                if (input.type === 'password') {
                    input.type = 'text';
                    this.querySelector('span').innerText = 'visibility_off';
                } else {
                    input.type = 'password';
                    this.querySelector('span').innerText = 'visibility';
                }
            });
        }
    </script>
</body></html>
