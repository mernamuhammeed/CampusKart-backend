<script>
        // Interactive Star Rating Logic
        const stars = document.querySelectorAll('.star');
        const ratingLabel = document.getElementById('ratingLabel');
        const labels = ["Poor", "Fair", "Good", "Great", "Excellent"];

        stars.forEach((star, index) => {
            star.addEventListener('click', () => {
                const rating = index + 1;
                updateStars(rating);
                ratingLabel.textContent = labels[index];
                ratingLabel.classList.add('animate-in', 'zoom-in-95');
                setTimeout(() => ratingLabel.classList.remove('animate-in', 'zoom-in-95'), 300);
            });

            star.addEventListener('mouseenter', () => {
                updateStars(index + 1, true);
            });

            star.addEventListener('mouseleave', () => {
                const currentRating = Array.from(stars).filter(s => s.classList.contains('active')).length;
                updateStars(currentRating);
            });
        });

        function updateStars(rating, isHover = false) {
            stars.forEach((star, i) => {
                if (i < rating) {
                    star.classList.add('active');
                    if (isHover) star.style.opacity = '0.7';
                    else star.style.opacity = '1';
                } else {
                    star.classList.remove('active');
                    star.style.opacity = '0.3';
                }
            });
        }

        // Micro-interaction for Submit
        document.getElementById('submitBtn').addEventListener('click', function() {
            this.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span>`;
            this.disabled = true;
            this.classList.add('opacity-80');
            
            setTimeout(() => {
                this.innerHTML = `Success!`;
                this.classList.remove('bg-primary-container');
                this.classList.add('bg-on-primary-container', 'text-primary');
                
                // Show a success state after feedback is sent
                confettiEffect();
            }, 1200);
        });

        function confettiEffect() {
            // Simple visual cue for completion
            const mainCard = document.querySelector('.glass-panel');
            mainCard.classList.add('ring-2', 'ring-primary', 'transition-all');
        }
    </script>
